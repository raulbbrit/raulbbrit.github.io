<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Page not found | Raul Brito</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237c9cff'/%3E%3C/svg%3E">
  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* standalone page: styles inline so it works at any path */
    @font-face { font-family: 'Geist'; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-latin.woff2) format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-mono-latin.woff2) format('woff2'); }
    :root { --bg: #000; --fg: #ededed; --mut: #a0a0a8; --dim: #7d7d86; --line-2: #3a3a40; --acc: #7c9cff; }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font: 400 16px/1.6 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(640px, 100%); }
    pre { margin: 0 0 32px; color: var(--acc); font: 400 13px/1.15 'Geist Mono', ui-monospace, monospace; }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 64px); line-height: 1.02; font-weight: 600; letter-spacing: -0.045em; }
    p { margin: 16px 0 0; color: var(--mut); max-width: 46ch; }
    p[lang] { color: var(--dim); font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a {
      padding: 12px 20px;
      border: 1px solid var(--line-2);
      border-radius: 2px;
      color: var(--fg);
      font-weight: 500;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    a:hover { border-color: var(--fg); }
    a.primary { background: var(--fg); border-color: var(--fg); color: #000; }
    a.primary:hover { background: var(--acc); border-color: var(--acc); }
    a:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <pre aria-hidden="true">.:-=+*#%@   ?   @%#*+=-:.</pre>
    <h1>This page does not exist.</h1>
    <p>The address may have changed or been mistyped. Go back to the start to see the projects.</p>
    <p lang="pt-BR">Esta página não existe. Volte ao início para ver os projetos.</p>
    <div class="actions">
      <a class="primary" href="index.html" data-site="/">Back to start</a>
      <a href="pt/index.html" data-site="/pt/" lang="pt-BR" hreflang="pt-BR">Versão em português</a>
    </div>
  </main>
  <script>
    // on GitHub Pages this page shows up at any path (/x/y/z), so relative links
    // would break; there they use the site root. Opened from disk, they stay relative.
    if (location.protocol !== 'file:') {
      document.querySelectorAll('[data-site]').forEach(function (a) { a.href = a.getAttribute('data-site'); });
    }
  </script>
</body>
</html>
